name: Sync and Build Image

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-increment version
        id: get_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Read current version from file (default to 1.0.0 if not exists)
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          
          # Increment patch version (last part of x.y.z)
          BASE_VERSION=$(echo $VERSION | cut -d. -f1,2)
          PATCH_VERSION=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))
          NEW_VERSION="$BASE_VERSION.$NEW_PATCH_VERSION"
          
          echo "Current Version: $VERSION"
          echo "New Version: $NEW_VERSION"
          
          # Save new version to file
          echo $NEW_VERSION > VERSION
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Commit and push back to main
          git add VERSION
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Sync to build-image branch
        run: |
          # The VERSION file is already updated and pushed to main in the previous step
          git checkout -B build-image main
          git push -f origin build-image

  build:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout build-image branch
        uses: actions/checkout@v4
        with:
          ref: build-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.sync.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
