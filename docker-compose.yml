version: '3.8'

services:
  md-pdf-watermark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md-pdf-watermark
    ports:
      - "8080:8080"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./temp_uploads:/app/temp_uploads
      - ./watermarks:/app/watermarks
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # 删除了 command 这一行，直接使用镜像内定义的默认指令
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s