version: '3.8'

services:
  md-pdf-watermark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md-pdf-watermark
    ports:
      - "8080:8080"
    volumes:
      # Mount input directory (optional, for persistent input files)
      - ./input:/app/input
      # Mount output directory (persistent output files)
      - ./output:/app/output
      # Mount temporary upload directory
      - ./temp_uploads:/app/temp_uploads
      # Mount watermarks directory (persistent generated watermarks)
      - ./watermarks:/app/watermarks
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
